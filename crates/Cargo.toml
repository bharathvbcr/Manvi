[workspace]
resolver = "3"
# Canonical sources live in DevCouncil rust/. These members are
# symlinks for local `cargo build` / verify.sh; release consumers pin or vendor
# from DevCouncil (see README note below and GitPulse vendor-crates.mjs).
members = ["dc-glob", "dc-grep", "dc-store", "dc-verify", "dc-evidence", "dc-proc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Canonical sources live in DevCouncil rust/, where `dc-store` inherits
# rusqlite, `dc-evidence` inherits sha2, `dc-proc` inherits libc and
# `dc-verify` inherits tree-sitter and four grammars from that workspace. This
# workspace must declare the same pins so
# `cargo build --manifest-path crates/Cargo.toml` can resolve `workspace = true`.
#
# A symlinked member inherits from *this* file, not from DevCouncil's, so a new
# `foo.workspace = true` upstream fails the whole workspace to load — not just
# that member — until its pin is mirrored below. The failure names the
# inherited key, so read the `Caused by` chain rather than the member it
# blamed. These eight are every workspace-inherited dependency the six members
# currently declare; the spec strings are DevCouncil's, and Cargo.lock holds
# the versions DevCouncil's own lock resolves.
[workspace.dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"
libc = "0.2"
# dc-verify's AST-aware stub and test-rigor detection (src/stub_ast.rs).
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"

# Every other crate a member pulls in is a dependency-audit surface paid for
# weekly; the analysis plane earns one when a task needs it, not before, and
# it is declared by the single member that needs it rather than hoisted here
# where it would look like a house standard. dc-grep takes ripgrep's engine
# (grep-regex, grep-searcher, ignore) because reimplementing ignore-rule
# resolution and a line-oriented searcher is exactly the second engine this
# workspace exists to avoid keeping in step with the first.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
