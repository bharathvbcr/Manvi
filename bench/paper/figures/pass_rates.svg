<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="360" fill="#fff"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Pass rate on the eight-task hard suite (n = 5 repeats)</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#555">Error bars: percentile bootstrap 95% CI on the mean per-repeat pass rate. Source: Manvi GH200, tag hard, 160 episodes.</text>
  <!-- axes -->
  <line x1="80" y1="300" x2="680" y2="300" stroke="#222" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="300" stroke="#222" stroke-width="1"/>
  <text x="36" y="190" transform="rotate(-90 36 190)" font-size="11" fill="#333">Pass rate (%)</text>
  <!-- y ticks -->
  <g font-size="10" fill="#444">
    <line x1="76" y1="300" x2="80" y2="300" stroke="#222"/><text x="72" y="304" text-anchor="end">0</text>
    <line x1="76" y1="245" x2="680" y2="245" stroke="#eee"/><text x="72" y="249" text-anchor="end">25</text>
    <line x1="76" y1="190" x2="680" y2="190" stroke="#eee"/><text x="72" y="194" text-anchor="end">50</text>
    <line x1="76" y1="135" x2="680" y2="135" stroke="#eee"/><text x="72" y="139" text-anchor="end">75</text>
    <line x1="76" y1="80" x2="680" y2="80" stroke="#eee"/><text x="72" y="84" text-anchor="end">100</text>
  </g>
  <!-- bars: y = 300 - pct*2.2 -->
  <!-- Qwen full 97.5 CI 92.5-100 : y=85.5, lo=96.5, hi=80 -->
  <rect x="130" y="85.5" width="70" height="214.5" fill="#2f6fed"/>
  <line x1="165" y1="96.5" x2="165" y2="80" stroke="#111" stroke-width="1.5"/>
  <line x1="158" y1="96.5" x2="172" y2="96.5" stroke="#111"/><line x1="158" y1="80" x2="172" y2="80" stroke="#111"/>
  <text x="165" y="318" text-anchor="middle" font-size="10" fill="#333">Qwen full</text>
  <text x="165" y="78" text-anchor="middle" font-size="10" fill="#111">97.5</text>
  <!-- Qwen base 75 CI 62.5-85 : y=135, lo=162.5, hi=113 -->
  <rect x="230" y="135" width="70" height="165" fill="#9bb8f5"/>
  <line x1="265" y1="162.5" x2="265" y2="113" stroke="#111" stroke-width="1.5"/>
  <line x1="258" y1="162.5" x2="272" y2="162.5" stroke="#111"/><line x1="258" y1="113" x2="272" y2="113" stroke="#111"/>
  <text x="265" y="318" text-anchor="middle" font-size="10" fill="#333">Qwen baseline</text>
  <text x="265" y="128" text-anchor="middle" font-size="10" fill="#111">75.0</text>
  <!-- Ornith full 62.5 CI 47.5-77.5 : y=162.5, lo=195.5, hi=129.5 -->
  <rect x="390" y="162.5" width="70" height="137.5" fill="#c45c26"/>
  <line x1="425" y1="195.5" x2="425" y2="129.5" stroke="#111" stroke-width="1.5"/>
  <line x1="418" y1="195.5" x2="432" y2="195.5" stroke="#111"/><line x1="418" y1="129.5" x2="432" y2="129.5" stroke="#111"/>
  <text x="425" y="318" text-anchor="middle" font-size="10" fill="#333">Ornith full</text>
  <text x="425" y="156" text-anchor="middle" font-size="10" fill="#111">62.5</text>
  <!-- Ornith base 52.5 CI 37.5-65 : y=184.5, lo=217.5, hi=157 -->
  <rect x="490" y="184.5" width="70" height="115.5" fill="#e0b89a"/>
  <line x1="525" y1="217.5" x2="525" y2="157" stroke="#111" stroke-width="1.5"/>
  <line x1="518" y1="217.5" x2="532" y2="217.5" stroke="#111"/><line x1="518" y1="157" x2="532" y2="157" stroke="#111"/>
  <text x="525" y="318" text-anchor="middle" font-size="10" fill="#333">Ornith baseline</text>
  <text x="525" y="178" text-anchor="middle" font-size="10" fill="#111">52.5</text>
  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#666">Figure 2. Mean pass rate. Qwen-27B (mid) and Ornith-35B-A3B Q8 (labeled strong in the protocol). 8 tasks × 5 seeds.</text>
</svg>
