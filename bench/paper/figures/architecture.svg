<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Helvetica, Arial, sans-serif">
  <rect width="860" height="420" fill="#fff"/>
  <text x="430" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Harness loop. Flags are independently switchable; the verifier is not.</text>

  <rect x="24" y="56" width="200" height="88" rx="6" fill="#eef3fc" stroke="#2f6fed"/>
  <text x="124" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Initial context</text>
  <text x="124" y="102" text-anchor="middle" font-size="11" fill="#333">system prompt</text>
  <text x="124" y="118" text-anchor="middle" font-size="11" fill="#333">envboot · groundfs · task</text>

  <rect x="268" y="56" width="200" height="88" rx="6" fill="#eef3fc" stroke="#2f6fed"/>
  <text x="368" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Model turn</text>
  <text x="368" y="102" text-anchor="middle" font-size="11" fill="#333">Ollama chat + tools</text>
  <text x="368" y="118" text-anchor="middle" font-size="11" fill="#333">append-only history</text>

  <rect x="512" y="56" width="200" height="88" rx="6" fill="#eef3fc" stroke="#2f6fed"/>
  <text x="612" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Sandbox tools</text>
  <text x="612" y="102" text-anchor="middle" font-size="11" fill="#333">shell · read · write · edit</text>
  <text x="612" y="118" text-anchor="middle" font-size="11" fill="#333">outcap · loopbreak</text>

  <rect x="756" y="56" width="80" height="88" rx="6" fill="#f7eee8" stroke="#c45c26"/>
  <text x="796" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#111">finish?</text>
  <text x="796" y="112" text-anchor="middle" font-size="11" fill="#333">yes / no</text>

  <path d="M224 100 L268 100" stroke="#333" marker-end="url(#a)"/>
  <path d="M468 100 L512 100" stroke="#333" marker-end="url(#a)"/>
  <path d="M712 100 L756 100" stroke="#333" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>

  <rect x="40" y="188" width="240" height="72" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="160" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#111">checklist (first finish)</text>
  <text x="160" y="236" text-anchor="middle" font-size="11" fill="#333">four questions, keep working</text>

  <rect x="310" y="188" width="240" height="72" rx="6" fill="#f4f4f4" stroke="#888"/>
  <text x="430" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#111">verifygate (subsequent finish)</text>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#333">hidden tests; fail → keep working</text>

  <rect x="580" y="188" width="240" height="72" rx="6" fill="#1a1a1a" stroke="#111"/>
  <text x="700" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Final verifier (always)</text>
  <text x="700" y="236" text-anchor="middle" font-size="11" fill="#ddd">unrun ≠ passed; agent cannot write tests</text>

  <path d="M796 144 L796 170 L160 170 L160 188" fill="none" stroke="#888"/>
  <path d="M796 144 L796 170 L430 170 L430 188" fill="none" stroke="#888"/>
  <path d="M796 144 L796 170 L700 170 L700 188" fill="none" stroke="#888"/>

  <rect x="40" y="292" width="780" height="96" rx="6" fill="#fafafa" stroke="#ccc"/>
  <text x="430" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Stop conditions (max_steps = 0 on the reported grid)</text>
  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#333">finished · no_tool_call · context_exhausted (90% of num_ctx) · ModelError</text>
  <text x="430" y="362" text-anchor="middle" font-size="11" fill="#555">A turn budget of 40 was used on some early episodes and then retired. Those episodes were re-run under the uncapped policy.</text>
</svg>
