<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Helvetica, Arial, sans-serif">
  <rect width="720" height="340" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Paired Δ = full − baseline, by repeat</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#555">Each point is one seed (0–4). Horizontal line at 0. Qwen Δ ≥ 0 on every repeat; Ornith Δ changes sign.</text>
  <line x1="70" y1="190" x2="680" y2="190" stroke="#222"/>
  <line x1="70" y1="70" x2="70" y2="300" stroke="#222"/>
  <text x="28" y="185" transform="rotate(-90 28 185)" font-size="11" fill="#333">Δ pass rate</text>
  <!-- y: 190 - d*220  so +0.5 -> 80, -0.25 -> 245, +0.625 -> 52.5 -->
  <g font-size="10" fill="#444">
    <text x="64" y="84" text-anchor="end">+0.50</text>
    <line x1="70" y1="80" x2="680" y2="80" stroke="#f0f0f0"/>
    <text x="64" y="139" text-anchor="end">+0.25</text>
    <line x1="70" y1="135" x2="680" y2="135" stroke="#f0f0f0"/>
    <text x="64" y="194" text-anchor="end">0</text>
    <text x="64" y="249" text-anchor="end">−0.25</text>
    <line x1="70" y1="245" x2="680" y2="245" stroke="#f0f0f0"/>
  </g>
  <!-- Qwen deltas: 0.5, 0.25, 0.125, 0.25, 0.0  xs 140,220,300,380,460 -->
  <polyline fill="none" stroke="#2f6fed" stroke-width="2" points="140,80 220,135 300,162.5 380,135 460,190"/>
  <g fill="#2f6fed">
    <circle cx="140" cy="80" r="5"/><circle cx="220" cy="135" r="5"/><circle cx="300" cy="162.5" r="5"/><circle cx="380" cy="135" r="5"/><circle cx="460" cy="190" r="5"/>
  </g>
  <!-- Ornith: 0.25, -0.25, 0.625, 0.125, -0.25 -->
  <polyline fill="none" stroke="#c45c26" stroke-width="2" points="140,135 220,245 300,52.5 380,162.5 460,245"/>
  <g fill="#c45c26">
    <circle cx="140" cy="135" r="5"/><circle cx="220" cy="245" r="5"/><circle cx="300" cy="52.5" r="5"/><circle cx="380" cy="162.5" r="5"/><circle cx="460" cy="245" r="5"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="140" y="318" text-anchor="middle">0</text>
    <text x="220" y="318" text-anchor="middle">1</text>
    <text x="300" y="318" text-anchor="middle">2</text>
    <text x="380" y="318" text-anchor="middle">3</text>
    <text x="460" y="318" text-anchor="middle">4</text>
    <text x="360" y="334" text-anchor="middle">Repeat index (pinned seed)</text>
  </g>
  <rect x="520" y="70" width="12" height="12" fill="#2f6fed"/><text x="538" y="80" font-size="11" fill="#333">Qwen-27B  Δ̄ = +0.225</text>
  <rect x="520" y="92" width="12" height="12" fill="#c45c26"/><text x="538" y="102" font-size="11" fill="#333">Ornith-35B  Δ̄ = +0.100</text>
</svg>
