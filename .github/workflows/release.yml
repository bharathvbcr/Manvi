# Build and publish manvi binaries for darwin and linux (amd64, arm64) and windows (amd64).
#
# Triggered by version tags (v*). Each matrix cell builds on a runner of its
# own OS and links the Gusset engine (policy decisions use Go's fnmatch;
# see DevCouncil's docs/gusset-candidates.md): Linux fully static against
# musl, darwin against libSystem. Each binary must
# pass its own `gusset-check` (boundary parity and the I2 panic firewall)
# before it is uploaded; see scripts/release-build.sh. The publish job then
# attaches every artifact plus SHA-256 checksums and the curated notes in
# docs/releases/<tag>.md and a PROVENANCE.json that records the commit, run,
# verify run, pinned modules and toolchain. A verify gate runs first: the tag's
# commit must have a successful verify.yml run, or nothing is built. The
# publish job fetches the module pins too, because scripts/check-release.mjs
# compares the vendored contracts and the sibling checkouts with them.
#
# Every artifact has a CycloneDX SBOM next to it (scripts/release-sbom.sh):
# the Go module graph and, where the engine is linked, the Rust crates. The
# darwin binaries are signed and notarized (scripts/release-sign-macos.sh,
# APPLE_* secrets). A run without those secrets fails in the gate job, before
# anything is built, unless workflow_dispatch sets allow_unsigned; those
# darwin files are then named ...-UNSIGNED and the notes say so. The Windows
# binary is built CGO_ENABLED=0 with no Gusset engine, because gusset supports
# only unix targets; it is labelled that way in the notes and its SBOM. It is
# not Authenticode-signed. Details: docs/RELEASING.md.
#
# The Go module replaces DevCouncil and gusset with sibling checkouts. Those
# directories are not in this repository, so the build fetches the commits in
# scripts/module-pins.txt before compiling. Notes are published with
# --notes-file. They are not placed in an environment variable.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to stamp (for a dry-run build without publishing)"
        required: true
        type: string
      allow_unsigned:
        description: "Build the macOS binaries UNSIGNED when the APPLE_* secrets are absent (dry runs only; a tag push never sets this)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # One Rust, the same on every runner and every re-run, so a release can be
  # rebuilt. Keep in step with verify.yml (docs/VERIFICATION_AND_PARITY.md).
  RUST_TOOLCHAIN: "1.100.0"

concurrency:
  group: release-${{ github.ref }}
  # A cancelled publish can leave a release with a partial asset set.
  cancel-in-progress: false

jobs:
  # A tag builds whatever commit it names. Require that commit to have passed
  # verify.yml before anything is built or published.
  gate:
    name: verify gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      verify_run: ${{ steps.gate.outputs.run_url }}
      signing: ${{ steps.signing.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a passing verify run at this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/release-verify-gate.sh

      # Fails here, before any runner time is spent, when the macOS signing
      # secrets are absent and allow_unsigned was not set. Reports only which
      # secrets are missing, never a value.
      - name: macOS signing preflight
        id: signing
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && 'true' || 'false' }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/release-sign-macos.sh preflight

  build:
    name: manvi (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    # Windows runs the same bash scripts as the others.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Native runners: the Rust archive and the cgo link are per target,
        # and each binary runs its own gusset-check before upload. darwin/amd64
        # is built on the arm64 image with clang -arch x86_64 and checked
        # under Rosetta.
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15
            rust_target: x86_64-apple-darwin
          - goos: darwin
            goarch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
          # No engine on Windows (gusset is unix-only): CGO_ENABLED=0, so no
          # Rust target either.
          - goos: windows
            goarch: amd64
            runner: windows-latest
            rust_target: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      # Node runs scripts/check-release.mjs. The same version as verify.yml,
      # not whatever the runner image ships today.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache-dependency-path: manvi/go.sum

      # No third-party action for Rust, as in verify.yml. rustup is on every
      # runner image used here. If an image ever lacks it the job stops with a
      # message; nothing is downloaded and piped into a shell. The toolchain is
      # RUST_TOOLCHAIN above, never a floating channel. Windows builds without
      # cgo and has no Rust to install.
      - name: Rust toolchain
        if: matrix.goos != 'windows'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup is not on this runner image. Use an image that ships it; the release does not install it from the network." >&2
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$RUST_TARGET"
          rustc --version

      - name: musl-gcc
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/release-build.sh

      # Sign and notarize in place, then write the SBOM, so the SBOM's digest
      # is that of the file that ships. An unsigned dispatch run renames the
      # file to ...-UNSIGNED and updates $artifact.
      - name: Sign and notarize (macOS)
        if: matrix.goos == 'darwin'
        env:
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned && 'true' || 'false' }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/release-sign-macos.sh sign "dist/$artifact"

      - name: SBOM
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: bash scripts/release-sbom.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.artifact }}
          path: |
            dist/${{ env.artifact }}
            dist/${{ env.artifact }}.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: [gate, build]
    # A tag push publishes. workflow_dispatch runs the same job as a dry run:
    # every check, the checksums and the provenance, then it prints the
    # `gh release create` it would have run.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-release.mjs compares contracts/ with DevCouncil at the pin and
      # requires the siblings to be at their pins; only the build jobs had them.
      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          VERIFY_RUN_URL: ${{ needs.gate.outputs.verify_run }}
          RELEASE_UNSIGNED: ${{ needs.gate.outputs.signing == 'unsigned' && '1' || '0' }}
        run: bash scripts/release-publish.sh
