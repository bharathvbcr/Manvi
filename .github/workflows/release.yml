# Build and publish manvi binaries for darwin and linux (amd64, arm64).
#
# Triggered by version tags (v*). Each matrix cell produces a statically linked
# binary (CGO_ENABLED=0) stamped with the tag via -ldflags, then the publish
# job attaches every artifact plus SHA-256 checksums and the curated notes in
# docs/releases/<tag>.md. There is no Windows target — see verify.yml for why
# this tree does not build for GOOS=windows.
#
# The Go module replaces DevCouncil and gusset with sibling checkouts. Those
# directories are not in this repository, so the build fetches the commits in
# scripts/module-pins.txt before compiling. Notes are published with
# --notes-file. They are not placed in an environment variable.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to stamp (for a dry-run build without publishing)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A cancelled publish can leave a release with a partial asset set.
  cancel-in-progress: false

jobs:
  build:
    name: manvi (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache-dependency-path: manvi/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/release-build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact }}
          path: dist/${{ env.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: build
    # Only real tag pushes publish. workflow_dispatch is a build-only dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/release-publish.sh
