# Build and publish manvi binaries for darwin and linux (amd64, arm64).
#
# Triggered by version tags (v*). Each matrix cell builds on a runner of its
# own OS and links the Gusset engine (policy decisions use Go's fnmatch;
# see DevCouncil's docs/gusset-candidates.md): Linux fully static against
# musl, darwin against libSystem. Each binary must
# pass its own `gusset-check` (boundary parity and the I2 panic firewall)
# before it is uploaded; see scripts/release-build.sh. The publish job then
# attaches every artifact plus SHA-256 checksums and the curated notes in
# docs/releases/<tag>.md and a PROVENANCE.json that records the commit, run,
# verify run, pinned modules and toolchain. A verify gate runs first: the tag's
# commit must have a successful verify.yml run, or nothing is built. The
# publish job fetches the module pins too, because scripts/check-release.mjs
# compares the vendored contracts and the sibling checkouts with them. There is
# no Windows target — see verify.yml for why
# this tree does not build for GOOS=windows, and gusset is unix-only.
#
# The Go module replaces DevCouncil and gusset with sibling checkouts. Those
# directories are not in this repository, so the build fetches the commits in
# scripts/module-pins.txt before compiling. Notes are published with
# --notes-file. They are not placed in an environment variable.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to stamp (for a dry-run build without publishing)"
        required: true
        type: string

permissions:
  contents: read

env:
  # One Rust, the same on every runner and every re-run, so a release can be
  # rebuilt. Keep in step with verify.yml (docs/VERIFICATION_AND_PARITY.md).
  RUST_TOOLCHAIN: "1.99.0"

concurrency:
  group: release-${{ github.ref }}
  # A cancelled publish can leave a release with a partial asset set.
  cancel-in-progress: false

jobs:
  # A tag builds whatever commit it names. Require that commit to have passed
  # verify.yml before anything is built or published.
  gate:
    name: verify gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      verify_run: ${{ steps.gate.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a passing verify run at this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/release-verify-gate.sh

  build:
    name: manvi (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Native runners: the Rust archive and the cgo link are per target,
        # and each binary runs its own gusset-check before upload. darwin/amd64
        # is built on the arm64 image with clang -arch x86_64 and checked
        # under Rosetta.
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15
            rust_target: x86_64-apple-darwin
          - goos: darwin
            goarch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      # Node runs scripts/check-release.mjs. The same version as verify.yml,
      # not whatever the runner image ships today.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache-dependency-path: manvi/go.sum

      # No third-party action for Rust, as in verify.yml. rustup is on the
      # ubuntu and macOS images; installed here if an image lacks it.
      - name: Rust toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$RUST_TARGET"
          rustc --version

      - name: musl-gcc
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/release-build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.artifact }}
          path: dist/${{ env.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: [gate, build]
    # A tag push publishes. workflow_dispatch runs the same job as a dry run:
    # every check, the checksums and the provenance, then it prints the
    # `gh release create` it would have run.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-release.mjs compares contracts/ with DevCouncil at the pin and
      # requires the siblings to be at their pins; only the build jobs had them.
      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          VERIFY_RUN_URL: ${{ needs.gate.outputs.verify_run }}
        run: bash scripts/release-publish.sh
