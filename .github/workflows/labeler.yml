# Label a pull request by the paths it changes (.github/labeler.yml).
#
# pull_request_target runs with a token that can write to the repository, from
# the base branch's copy of this workflow, so it must never run code from the
# pull request. It does not: there is no checkout, and actions/labeler reads the
# changed-file list and the config from the API, the config at the base
# revision. Do not add a checkout or a `run` step here.
name: labeler

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
