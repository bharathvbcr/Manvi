# Close issues and pull requests that nobody has touched. The maintainer is one
# person, so an open item with no activity is either waiting on its author or
# no longer wanted; closing it keeps the list honest, and it can be reopened.
# Anything labelled security, pinned, good first issue or help wanted is
# exempt, as is anything assigned or on a milestone.
name: stale

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days, so it is marked stale and
            will be closed in 14 days unless there is new activity. Comment to keep
            it open; a closed issue can be reopened.
          stale-pr-message: >
            This pull request has had no activity for 60 days, so it is marked
            stale and will be closed in 14 days unless there is new activity.
            Push or comment to keep it open; a closed pull request can be reopened.
          close-issue-message: >
            Closed for inactivity. Reopen it, or open a new issue, if this is still
            relevant.
          close-pr-message: >
            Closed for inactivity. Reopen it, or open a new pull request, if this is
            still relevant.
          exempt-issue-labels: 'security,pinned,good first issue,help wanted'
          exempt-pr-labels: 'security,pinned'
          exempt-all-milestones: true
          exempt-all-assignees: true
          exempt-draft-pr: true
          operations-per-run: 100
