# One gate, run by a machine instead of by whoever remembered.
#
# verify.sh is the whole check — this file exists to run it on a machine nobody
# has been developing on, and to make sure it runs *fully*. That second half is
# the point. Almost every gate inside verify.sh degrades to "NOT COVERED" when
# its tool is absent, which is the honest answer on a laptop and the wrong one
# here: a CI run that quietly skipped the linter, the vulnerability scan and the
# nil analysis would print a green check indistinguishable from one that ran
# them. So the analysis tools are installed before the gate, and the run is
# rejected afterwards if any of them turned out to be missing.
#
# Every tool and toolchain is pinned, and the versions live in one file,
# scripts/tool-versions.env, which each install step sources. The lint debt
# ratchet and the nilaway ceiling are counts, and a count taken with whichever
# release `@latest` resolved to that day is a measurement of the release. A pin
# moves in a change that also re-measures those two numbers.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The opt-in gates below, once a day. Off-peak so a wedged fuzz run is not
  # competing with the pull requests it exists to protect.
  schedule:
    - cron: '17 6 * * *'

# A superseded push has nothing to say about the branch's current head.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag. A tag is mutable: `@v7` is a
# reference the action's owner can move, so a workflow that trusts one runs
# whatever that reference points at on the day it runs. This repository does not
# accept that anywhere else — the Go plane pins go 1.26.6 rather than 1.26, and
# the Rust dependency tree is audited on every run — and CI is the one place
# where an unnoticed substitution would have a credential-bearing token in
# scope. The version each SHA corresponds to is in the comment beside it so a
# reader can tell what is pinned without resolving the hash; dependabot keeps
# both halves current.

jobs:
  gate:
    name: verify.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # An explicit bound, because the default is six hours and a wedged step
    # would hold the runner for all of them. The run is measured in tens of
    # minutes; this is above that by a wide margin and exists to bound a wedge.
    timeout-minutes: 90
    env:
      # fetch-modules.sh checks the pins out first. This fails the job when
      # the checkout is any other commit, which is a different product than
      # the one verify.sh just built.
      MANVI_REQUIRE_MODULE_PINS: "1"
    strategy:
      # Both halves of the matrix report. A failure on one platform is a fact
      # about the code, not a reason to stop learning about the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # manvi/go.mod replaces DevCouncil and gusset with sibling directories
      # that are not in this checkout. go vet fails closed on that absence;
      # fetching the pins is what makes the absence visible as a missing
      # commit rather than a missing directory.
      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      # The version comes from go.mod so this file cannot drift away from the
      # toolchain the module declares.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache-dependency-path: manvi/go.sum

      # No third-party action for Rust: both runner images ship rustup, and a
      # marketplace action here would be a supply-chain dependency bought for
      # two lines of shell. The toolchain is the pinned one, not `stable`: a
      # new release adds clippy lints, and -D warnings turns each into a red
      # build on a day nothing in this repository changed. Edition 2024 in
      # crates/Cargo.toml needs >= 1.85.
      - name: Rust toolchain
        run: |
          . scripts/tool-versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # jsdom 30 requires ^22.22.2; mermaid 12 requires 22.12+. Kept equal to
          # NODE_VERSION in scripts/tool-versions.env by scripts/verify-lib.test.mjs.
          node-version: 22.22.2
      # Installs the docs tooling and audits bun.lock; the version comes from
      # package.json's packageManager field.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # cargo-audit is a compile, not a download, and it is the same compile on
      # every run. Keyed on the toolchain so a rustup bump rebuilds it.
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ matrix.os }}-${{ hashFiles('scripts/tool-versions.env') }}

      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      # Every tool verify.sh will otherwise report as NOT COVERED, at the
      # versions in scripts/tool-versions.env. They used to float so the gate
      # would catch a new linter's new rule while the change that trips it was
      # in review; what that caught instead was a red main on days nothing
      # changed, and a debt ratchet whose numbers belonged to the release.
      # Upgrading is a pull request that moves the pin and the counts together.
      - name: Analysis tools
        run: |
          . scripts/tool-versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "go.uber.org/nilaway/cmd/nilaway@$NILAWAY_VERSION"
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ] || ! cargo audit --version | grep -qF "$CARGO_AUDIT_VERSION"; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
          fi
          # bench/stress_test.py refuses an uncontained Linux shell; macOS
          # already has sandbox-exec on the runner image.
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
            # Ubuntu's AppArmor refuses unprivileged user namespaces, so
            # bwrap cannot write its uid map and every sandboxed bench check
            # fails with "setting up uid map: Permission denied". The stress
            # suite refuses to run the shell uncontained, so the kernel has
            # to allow the namespace the suite already requires.
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Tee rather than pipe: the exit status being checked is verify.sh's own,
      # and `set -o pipefail` is not on by default in an Actions step.
      - name: verify.sh
        run: ./verify.sh 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      # verify.sh always ends with gates it could not run — the hosted provider
      # adapters are checked against scripted servers, devmap is not built by
      # this repository, and no local model server is listening here. Those are
      # expected and listed, with reasons, in scripts/verify-expected-gaps.json.
      # A missing *analysis tool* is not: it means the step above failed to
      # provision and the gate that did not run would have been read as a gate
      # that passed. Any other NOT COVERED line, and any skipped test that is
      # not listed for this runner, fails here instead of passing as green. The
      # same script guards the deep jobs below.
      - name: Every gate ran and every gap is named
        if: always()
        run: scripts/check-verify-log.sh verify.log ${{ matrix.os }} default

      # The colour codes are stripped first, and the pattern deliberately does
      # not start at "PASS". verify.sh writes that verdict as
      # `\033[33mPASS\033[0m with gates that did not run:` — there is an ANSI
      # reset between the word and the rest of the sentence, so a grep for the
      # whole line matches nothing and reports "(none reported)" for every run,
      # including the ones with gates that did not run. A summary that says
      # "none" because its pattern stopped matching is the exact failure this
      # repository refuses everywhere else.
      - name: Verdict
        if: always()
        run: |
          sed $'s/\033\[[0-9;]*m//g' verify.log > verify.plain
          {
            echo '### verify.sh — ${{ matrix.os }}'
            echo
            echo '```'
            grep -A 100 'with gates that did not run' verify.plain \
              || tail -1 verify.plain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-log-${{ matrix.os }}
          path: verify.log
          retention-days: 14

  # Windows. verify.sh is bash and its gates drive Unix tools — a pty, bwrap —
  # so it does not run here. What does run is the Go plane without cgo: it
  # builds, and the Go suite runs. Several of those tests exec dcverify,
  # dcstore and dcgrep, so this job also installs the pinned Rust toolchain
  # and repairs crate symlinks a Windows checkout may have flattened.
  # `procgroup_other.go`, `mkfifo_other.go` and the Windows halves of
  # `artifacts` and `devcouncil` are compiled by nothing else in this matrix,
  # and a build that only cross-compiles has never run one of their tests.
  #
  # Every test compiles for Windows (`GOOS=windows go vet ./...` is a step of
  # verify.sh, so a Unix-only call in a test file cannot return). Whether they
  # all pass here has not been established: this job's first result is that
  # evidence, and a failing test is a finding about the Windows port, not noise
  # to be excluded.
  windows:
    name: go test (windows-latest)
    runs-on: windows-latest
    # Go tests that cross into dcverify, dcstore or dcgrep build those binaries
    # during the run. The first cargo build of rusqlite is most of the time;
    # 90 minutes bounds a wedge and still leaves room for that compile.
    timeout-minutes: 90
    env:
      CGO_ENABLED: "0"
      MANVI_REQUIRE_MODULE_PINS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Module replacements
        shell: bash
        run: bash scripts/fetch-modules.sh
      # checkout on Windows can materialise a git symlink (mode 120000) as a
      # text file. cargo then has no crate to build, and every Go test that
      # execs dcverify fails closed. Recreate any member that is not a directory
      # after the pin it points at has been fetched.
      - name: Crate symlinks
        shell: bash
        run: |
          git ls-files -s -- crates | while read -r mode hash _ path; do
            [ "$mode" = "120000" ] || continue
            if [ -d "$path" ]; then
              continue
            fi
            target="$(git cat-file -p "$hash")"
            target="${target//$'\r'/}"
            target="${target//$'\n'/}"
            rm -f "$path"
            ln -s "$target" "$path"
          done
          for member in dc-glob dc-grep dc-store dc-verify dc-evidence dc-proc dc-redact; do
            if [ ! -f "crates/$member/Cargo.toml" ]; then
              echo "crates/$member is not a crate checkout (Cargo.toml missing)" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache-dependency-path: manvi/go.sum
      # The headless tests build dcverify themselves. ubuntu and macOS already
      # have rustup from the gate job; this image may not, and a missing
      # toolchain must fail here rather than as a bounce inside go test.
      - name: Rust toolchain
        shell: bash
        run: |
          . scripts/tool-versions.env
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-windows-latest-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-windows-latest-
      - name: go build
        working-directory: manvi
        run: go build ./...
      - name: go test
        working-directory: manvi
        run: go test -count=1 -timeout 45m ./...

  # The two opt-in gates. They take a flag each and cost real time, which is
  # why verify.sh keeps them out of the default run and why they are not on
  # every pull request. Nightly is often enough to find what they find, and
  # workflow_dispatch is there for the change that warrants one on demand.
  deep:
    name: verify.sh --${{ matrix.mode }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The verify step below is bounded at 90 minutes. This is that plus the
    # toolchain install, so a wedged setup step cannot hold the runner for the
    # six-hour default.
    timeout-minutes: 150
    env:
      MANVI_REQUIRE_MODULE_PINS: "1"
    strategy:
      fail-fast: false
      matrix:
        mode: [race, fuzz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Module replacements
        run: bash scripts/fetch-modules.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache-dependency-path: manvi/go.sum
      - name: Rust toolchain
        run: |
          . scripts/tool-versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # jsdom 30 requires ^22.22.2; mermaid 12 requires 22.12+. Kept equal to
          # NODE_VERSION in scripts/tool-versions.env by scripts/verify-lib.test.mjs.
          node-version: 22.22.2
      # Installs the docs tooling and audits bun.lock; the version comes from
      # package.json's packageManager field.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Same caches as the gate job. This job used to compile cargo-audit and
      # the Rust workspace from scratch on every nightly run.
      - name: Cache cargo-audit
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-ubuntu-latest-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Cache Rust build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-ubuntu-latest-${{ hashFiles('crates/Cargo.lock') }}
          restore-keys: cargo-ubuntu-latest-
      - name: Analysis tools
        run: |
          . scripts/tool-versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "go.uber.org/nilaway/cmd/nilaway@$NILAWAY_VERSION"
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ] || ! cargo audit --version | grep -qF "$CARGO_AUDIT_VERSION"; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
          fi
          # bench/stress_test.py refuses an uncontained Linux shell; macOS
          # already has sandbox-exec on the runner image.
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
            # Ubuntu's AppArmor refuses unprivileged user namespaces, so
            # bwrap cannot write its uid map and every sandboxed bench check
            # fails with "setting up uid map: Permission denied". The stress
            # suite refuses to run the shell uncontained, so the kernel has
            # to allow the namespace the suite already requires.
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # --race and --fuzz each re-run the default gate first, so this is the
      # whole file plus the extra mode. --race turns cgo on. verify.sh takes
      # DevCouncil's gusset-engine/cgo-env.sh exports before that link;
      # without the umbrella archive the detector dies on -lgusset.
      # 90 minutes is above the serialised race run's measured 4.4 minutes by
      # a wide margin and exists to bound a wedge, not to accommodate one.
      # Tee rather than pipe, for the reason the gate job gives. The log is what
      # the guards below read: before this job kept one, a fuzz or race run in
      # which a tool failed to provision, or a leg degraded to NOT COVERED, was
      # green, because verify.sh exits 0 on those.
      - name: verify.sh --${{ matrix.mode }}
        timeout-minutes: 90
        run: ./verify.sh --${{ matrix.mode }} 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      - name: Every gate ran and every gap is named
        if: always()
        run: scripts/check-verify-log.sh verify.log ubuntu-latest ${{ matrix.mode }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verify-log-${{ matrix.mode }}
          path: verify.log
          retention-days: 14
