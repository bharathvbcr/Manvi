# One gate, run by a machine instead of by whoever remembered.
#
# verify.sh is the whole check — this file exists to run it on a machine nobody
# has been developing on, and to make sure it runs *fully*. That second half is
# the point. Almost every gate inside verify.sh degrades to "NOT COVERED" when
# its tool is absent, which is the honest answer on a laptop and the wrong one
# here: a CI run that quietly skipped the linter, the vulnerability scan and the
# nil analysis would print a green check indistinguishable from one that ran
# them. So the analysis tools are installed before the gate, and the run is
# rejected afterwards if any of them turned out to be missing.
#
# Every tool and toolchain is pinned, and the versions live in one file,
# scripts/tool-versions.env, which each install step sources. The lint debt
# ratchet and the nilaway ceiling are counts, and a count taken with whichever
# release `@latest` resolved to that day is a measurement of the release. A pin
# moves in a change that also re-measures those two numbers.
#
# Caches are restored and saved by separate steps, and a save runs once the
# step that fills the cache has succeeded, whatever the job's verdict.
# `actions/cache` and setup-go's built-in cache both save in a post step that
# only runs when the whole job succeeded, and this gate is the one job where a
# red run is routine: while it was red nothing was ever saved, so every run
# recompiled cargo-audit, the Rust workspace, the lint tools and the whole Go
# tree from nothing (the "Analysis tools" step alone was 4-5 minutes). A build
# cache is content-addressed, so what a finished run built is as valid as what
# a green run built; it is only the verdict that is red. What is not saved is a
# run that stopped before the cache was full, because the exact key is never
# refreshed once someone has taken it.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The opt-in gates below, once a day. Off-peak so a wedged fuzz run is not
  # competing with the pull requests it exists to protect.
  schedule:
    - cron: '17 6 * * *'

# A superseded push has nothing to say about the branch's current head.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned by commit SHA, not by tag. A tag is mutable: `@v7` is a
# reference the action's owner can move, so a workflow that trusts one runs
# whatever that reference points at on the day it runs. This repository does not
# accept that anywhere else — the Go plane pins go 1.27.4 rather than 1.27, and
# the Rust dependency tree is audited on every run — and CI is the one place
# where an unnoticed substitution would have a credential-bearing token in
# scope. The version each SHA corresponds to is in the comment beside it so a
# reader can tell what is pinned without resolving the hash; dependabot keeps
# both halves current. actions/cache/restore and actions/cache/save are
# directories of the same repository, so they carry the same SHA as actions/cache.

jobs:
  gate:
    name: verify.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # An explicit bound, because the default is six hours and a wedged step
    # would hold the runner for all of them. The run is measured in tens of
    # minutes; this is above that by a wide margin and exists to bound a wedge.
    timeout-minutes: 90
    env:
      # fetch-modules.sh checks the pins out first. This fails the job when
      # the checkout is any other commit, which is a different product than
      # the one verify.sh just built.
      MANVI_REQUIRE_MODULE_PINS: "1"
    strategy:
      # Both halves of the matrix report. A failure on one platform is a fact
      # about the code, not a reason to stop learning about the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # manvi/go.mod replaces DevCouncil and gusset with sibling directories
      # that are not in this checkout. go vet fails closed on that absence;
      # fetching the pins is what makes the absence visible as a missing
      # commit rather than a missing directory.
      - name: Module replacements
        run: bash scripts/fetch-modules.sh

      # The version comes from go.mod so this file cannot drift away from the
      # toolchain the module declares. Its own cache is off: it would save in a
      # post step that never runs on a red job. The explicit pair below does.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache: false

      - name: Go cache locations
        id: go
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ matrix.os }}-${{ hashFiles('manvi/go.mod', 'manvi/go.sum') }}
          restore-keys: go-${{ matrix.os }}-

      # No third-party action for Rust: both runner images ship rustup, and a
      # marketplace action here would be a supply-chain dependency bought for
      # two lines of shell. The toolchain is the pinned one, not `stable`: a
      # new release adds clippy lints, and -D warnings turns each into a red
      # build on a day nothing in this repository changed. Edition 2024 in
      # crates/Cargo.toml needs >= 1.85.
      - name: Rust toolchain
        run: |
          . scripts/tool-versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30 requires ^22.22.2; mermaid 12 requires 22.12+. Kept equal to
          # NODE_VERSION in scripts/tool-versions.env by scripts/verify-lib.test.mjs.
          node-version: 22.22.2
      # Installs the docs tooling and audits bun.lock; the version comes from
      # package.json's packageManager field.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The analysis tools are compiled, and it is the same compile on every run.
      # Keyed on the Go release as well as the pins: golangci-lint and nilaway
      # type-check against the standard library they were built with.
      - name: Restore analysis tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin
            ~/.cargo/bin/cargo-audit
          key: tools-${{ matrix.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('scripts/tool-versions.env') }}

      - name: Restore Rust build
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
            native/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('crates/Cargo.lock', 'native/Cargo.lock', 'scripts/tool-versions.env') }}
          restore-keys: cargo-${{ matrix.os }}-

      # Every tool verify.sh will otherwise report as NOT COVERED, at the
      # versions in scripts/tool-versions.env. They used to float so the gate
      # would catch a new linter's new rule while the change that trips it was
      # in review; what that caught instead was a red main on days nothing
      # changed, and a debt ratchet whose numbers belonged to the release.
      # Upgrading is a pull request that moves the pin and the counts together.
      # Skipped on a cache hit; a tool the cache failed to supply is still caught
      # afterwards by check-verify-log.sh, which fails on "is not installed".
      - name: Analysis tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          . scripts/tool-versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "go.uber.org/nilaway/cmd/nilaway@$NILAWAY_VERSION"
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ] || ! cargo audit --version | grep -qF "$CARGO_AUDIT_VERSION"; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
          fi

      - name: Save analysis tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin
            ~/.cargo/bin/cargo-audit
          key: tools-${{ matrix.os }}-${{ steps.go.outputs.version }}-${{ hashFiles('scripts/tool-versions.env') }}

      # ruff is the one analysis tool this workflow never installed, so every run
      # ended "ruff is not installed" and the log guard rejected it as a
      # provisioning failure: no run of this job could be green. RUFF_VERSION has
      # been pinned in tool-versions.env since the lint was added; this is the
      # install it was waiting for. pipx ships on both runner images. Its home
      # and bin dir are set so the install lands somewhere the runner user owns
      # and PATH names, whatever the image presets. A wheel, not a compile, so
      # it is not cached.
      - name: Python lint tool
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          . scripts/tool-versions.env
          pipx install "ruff==$RUFF_VERSION"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          "$PIPX_BIN_DIR/ruff" --version | grep -F "$RUFF_VERSION"

      # What the tools need around them, every run: the tools on PATH, and on
      # Linux the sandbox the bench stress suite refuses to run without.
      - name: Sandbox and PATH
        run: |
          # bench/stress_test.py refuses an uncontained Linux shell; macOS
          # already has sandbox-exec on the runner image.
          if [ "$(uname -s)" = Linux ]; then
            if ! command -v bwrap >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y bubblewrap
            fi
            # Ubuntu's AppArmor refuses unprivileged user namespaces, so
            # bwrap cannot write its uid map and every sandboxed bench check
            # fails with "setting up uid map: Permission denied". The stress
            # suite refuses to run the shell uncontained, so the kernel has
            # to allow the namespace the suite already requires.
            if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Tee rather than pipe: the exit status being checked is verify.sh's own,
      # and `set -o pipefail` is not on by default in an Actions step. The two
      # MANVI_ variables ask verify.sh for a per-step time table and the Go
      # event stream; both are side files, so verify.log is unchanged.
      - name: verify.sh
        id: verify
        env:
          MANVI_STEP_TIMES: ${{ runner.temp }}/step-times.tsv
          MANVI_GO_TEST_JSON_OUT: ${{ runner.temp }}/go-test.json
        run: ./verify.sh 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      # Saved only when verify.sh itself succeeded — which is not the same as the
      # job being green: the log guard that follows can fail a run whose script
      # passed, and that run's trees are complete. What must not be saved is the
      # tree of a run that stopped early. The exact key is taken by whoever saves
      # first and never refreshed, so a run that died in the Go tests would freeze
      # a cache that has no Rust build or lint objects in it, and every later run
      # would see a hit and never fill it. A run that failed early therefore
      # leaves the cache cold for the next one, which is slower and not wrong.
      - name: Save Go caches
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-${{ matrix.os }}-${{ hashFiles('manvi/go.mod', 'manvi/go.sum') }}

      - name: Save Rust build
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
            native/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('crates/Cargo.lock', 'native/Cargo.lock', 'scripts/tool-versions.env') }}

      # verify.sh always ends with gates it could not run — the hosted provider
      # adapters are checked against scripted servers, devmap is not built by
      # this repository, and no local model server is listening here. Those are
      # expected and listed, with reasons, in scripts/verify-expected-gaps.json.
      # A missing *analysis tool* is not: it means the step above failed to
      # provision and the gate that did not run would have been read as a gate
      # that passed. Any other NOT COVERED line, and any skipped test that is
      # not listed for this runner, fails here instead of passing as green. The
      # same script guards the deep jobs below.
      - name: Every gate ran and every gap is named
        if: always()
        run: scripts/check-verify-log.sh verify.log ${{ matrix.os }} default

      # The colour codes are stripped first, and the pattern deliberately does
      # not start at "PASS". verify.sh writes that verdict as
      # `\033[33mPASS\033[0m with gates that did not run:` — there is an ANSI
      # reset between the word and the rest of the sentence, so a grep for the
      # whole line matches nothing and reports "(none reported)" for every run,
      # including the ones with gates that did not run. A summary that says
      # "none" because its pattern stopped matching is the exact failure this
      # repository refuses everywhere else.
      - name: Verdict
        if: always()
        run: |
          sed $'s/\033\[[0-9;]*m//g' verify.log > verify.plain
          {
            echo '### verify.sh — ${{ matrix.os }}'
            echo
            echo '```'
            grep -A 100 'with gates that did not run' verify.plain \
              || tail -1 verify.plain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Where the minutes went, so the next change to this pipeline starts from
      # a measurement. A missing table says so; it does not read as "nothing slow".
      - name: Where the time went
        if: always()
        run: |
          {
            echo '### step times — ${{ matrix.os }}'
            echo
            if [ -s "$RUNNER_TEMP/step-times.tsv" ]; then
              echo '| seconds | step |'
              echo '| ---: | --- |'
              sort -rn "$RUNNER_TEMP/step-times.tsv" | awk -F'\t' '{ printf "| %d | %s |\n", $1, $2 }'
            else
              echo 'verify.sh recorded no step times.'
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/go-test.json" ]; then
            GO_TEST_REPORT_TITLE='go test — ${{ matrix.os }}' node scripts/go-test-report.mjs report "$RUNNER_TEMP/go-test.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The Go test run left no event stream, so there is no slowest-test report.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-log-${{ matrix.os }}
          path: verify.log
          retention-days: 14

      # A second artifact, so verify-log-* keeps the layout it always had: with
      # several paths upload-artifact roots the zip at their common ancestor,
      # which would move verify.log down a directory for anything that reads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-timing-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/step-times.tsv
            ${{ runner.temp }}/go-test.json
          if-no-files-found: ignore
          retention-days: 14

  # Windows. verify.sh is bash and its gates drive Unix tools — a pty, bwrap —
  # so it does not run here. What does run is the Go plane without cgo: it
  # builds, and the Go suite runs. Several of those tests exec dcverify,
  # dcstore and dcgrep, so this job also installs the pinned Rust toolchain
  # and repairs crate symlinks a Windows checkout may have flattened.
  # `procgroup_other.go`, `mkfifo_other.go` and the Windows halves of
  # `artifacts` and `devcouncil` are compiled by nothing else in this matrix,
  # and a build that only cross-compiles has never run one of their tests.
  #
  # Every test compiles for Windows (`GOOS=windows go vet ./...` is a step of
  # verify.sh, so a Unix-only call in a test file cannot return). Whether they
  # all pass here has not been established: this job's first result is that
  # evidence, and a failing test is a finding about the Windows port, not noise
  # to be excluded.
  #
  # What this job must not do is spend 45 minutes saying nothing. In run
  # 43662567883 the test step took 46m45s against a 45 minute test timeout and
  # its output ended at minute two: `go test ./...` prints a package only when
  # it finishes, in package order, so a wedged package left no trace of where
  # the time went. (One run's log was read; the other recent main runs show the
  # same ~48 minute job duration, and none has been green.) The suite now runs as `go test -json`, which streams a `run`
  # event per test, under a tighter bound, and scripts/go-test-report.mjs names
  # every package and test that started and never finished. The bound is a
  # bound, not an exclusion: a test that needs longer fails here, by name.
  windows:
    name: go test (windows-latest)
    runs-on: windows-latest
    # Cold, the first cargo build of rusqlite is most of the compile and is done
    # by its own step below; each package's tests are bounded at 20 minutes.
    # This bounds the job as a whole, and a wedge in any step with no bound of
    # its own.
    timeout-minutes: 45
    env:
      CGO_ENABLED: "0"
      MANVI_REQUIRE_MODULE_PINS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Module replacements
        shell: bash
        run: bash scripts/fetch-modules.sh
      # checkout on Windows can materialise a git symlink (mode 120000) as a
      # text file. cargo then has no crate to build, and every Go test that
      # execs dcverify fails closed. Recreate any member that is not a directory
      # after the pin it points at has been fetched.
      - name: Crate symlinks
        shell: bash
        run: |
          git ls-files -s -- crates | while read -r mode hash _ path; do
            [ "$mode" = "120000" ] || continue
            if [ -d "$path" ]; then
              continue
            fi
            target="$(git cat-file -p "$hash")"
            target="${target//$'\r'/}"
            target="${target//$'\n'/}"
            rm -f "$path"
            ln -s "$target" "$path"
          done
          for member in dc-glob dc-grep dc-store dc-verify dc-evidence dc-proc dc-redact; do
            if [ ! -f "crates/$member/Cargo.toml" ]; then
              echo "crates/$member is not a crate checkout (Cargo.toml missing)" >&2
              exit 1
            fi
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache: false
      # The go test pipe below ends in node. A missing node would kill the last
      # stage, tee would take SIGPIPE, and go test would die with it — the one
      # failure this job's diagnostics must not cause — so node is pinned here
      # rather than assumed to be on the runner image's PATH.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Kept equal to NODE_VERSION in scripts/tool-versions.env by scripts/verify-lib.test.mjs.
          node-version: 22.22.2
      - name: Go cache locations
        id: go
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-windows-latest-${{ hashFiles('manvi/go.mod', 'manvi/go.sum') }}
          restore-keys: go-windows-latest-
      # The headless tests build dcverify themselves. ubuntu and macOS already
      # have rustup from the gate job. windows-latest ships it too; if an image
      # ever lacks it this step fails with a message (nothing is piped from the
      # network into a shell) rather than as a bounce inside go test.
      - name: Rust toolchain
        shell: bash
        run: |
          . scripts/tool-versions.env
          if ! command -v rustup >/dev/null 2>&1; then
            echo "rustup is not on this runner image; the job does not install it from the network." >&2
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Restore Rust build
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-windows-latest-${{ hashFiles('crates/Cargo.lock', 'scripts/tool-versions.env') }}
          restore-keys: cargo-windows-latest-
      # The three binaries the Go tests exec, built here and not inside the first
      # test that asks. testsupport builds on demand under a bound shared with
      # the test that asked, so a cold compile of rusqlite was being charged to a
      # test's budget on every run; here it is a step with its own time, and the
      # result is cached for the next one. These are the only three pairs
      # testsupport requests (DCStore, DCVerify, DCGrep), each as its own
      # `cargo build -p <crate> --bin <bin>` from crates/, and they are built the
      # same way here, one invocation each: a single `-p a -p b -p c` build can
      # resolve features differently, and then the tests' own build would
      # compile again instead of finding nothing to do.
      - name: Rust binaries the Go tests exec
        id: prebuild
        shell: bash
        working-directory: crates
        run: |
          cargo build -p dc-store --bin dcstore
          cargo build -p dc-verify --bin dcverify
          cargo build -p dc-grep --bin dcgrep
      - name: go build
        id: gobuild
        working-directory: manvi
        run: go build ./...
      # -json streams, so the log is the live run rather than a bundle printed
      # package by package; the text pass puts it back into the form people read.
      # `shell: bash` is what turns pipefail on: the exit status that matters is
      # go test's, not the last stage of the pipe. -timeout bounds each package's
      # test binary, not the suite: a wedged package is cut off at 20 minutes and
      # named in the report, and the packages after it still run.
      - name: go test
        shell: bash
        working-directory: manvi
        run: go test -json -count=1 -timeout 20m ./... | tee ../go-test.json | node ../scripts/go-test-report.mjs text
      # Both caches are complete by the time the tests start, so a failing suite
      # does not make them partial. A failed prebuild or build does, and is not
      # saved.
      - name: Save Go caches
        if: ${{ !cancelled() && steps.gobuild.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-windows-latest-${{ hashFiles('manvi/go.mod', 'manvi/go.sum') }}
      - name: Save Rust build
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
          key: cargo-windows-latest-${{ hashFiles('crates/Cargo.lock', 'scripts/tool-versions.env') }}
      # Names what never finished and what was slow. A missing event stream says
      # so rather than printing an empty table.
      - name: Where the time went
        if: always()
        shell: bash
        run: |
          if [ -s go-test.json ]; then
            GO_TEST_REPORT_TITLE='go test — windows-latest' node scripts/go-test-report.mjs report go-test.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The Go test run left no event stream, so there is no report.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: go-test-windows
          path: go-test.json
          retention-days: 14

  # The two opt-in gates. They take a flag each and cost real time, which is
  # why verify.sh keeps them out of the default run and why they are not on
  # every pull request. Nightly is often enough to find what they find, and
  # workflow_dispatch is there for the change that warrants one on demand.
  deep:
    name: verify.sh --${{ matrix.mode }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The verify step below is bounded at 90 minutes. This is that plus the
    # toolchain install, so a wedged setup step cannot hold the runner for the
    # six-hour default.
    timeout-minutes: 150
    env:
      MANVI_REQUIRE_MODULE_PINS: "1"
    strategy:
      fail-fast: false
      matrix:
        mode: [race, fuzz]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Module replacements
        run: bash scripts/fetch-modules.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: manvi/go.mod
          cache: false
      - name: Go cache locations
        id: go
        run: |
          {
            echo "build=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "version=$(go env GOVERSION)"
          } >> "$GITHUB_OUTPUT"
      # Shares the gate job's Go cache on purpose: the same tree, the same
      # compiler, and the gate's save is the one that populates it.
      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-ubuntu-latest-${{ hashFiles('manvi/go.mod', 'manvi/go.sum') }}
          restore-keys: go-ubuntu-latest-
      - name: Rust toolchain
        run: |
          . scripts/tool-versions.env
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # jsdom 30 requires ^22.22.2; mermaid 12 requires 22.12+. Kept equal to
          # NODE_VERSION in scripts/tool-versions.env by scripts/verify-lib.test.mjs.
          node-version: 22.22.2
      # Installs the docs tooling and audits bun.lock; the version comes from
      # package.json's packageManager field.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Same caches as the gate job, under the same keys, so the nightly reads
      # what the last gate run saved.
      - name: Restore analysis tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin
            ~/.cargo/bin/cargo-audit
          key: tools-ubuntu-latest-${{ steps.go.outputs.version }}-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Restore Rust build
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
            native/target
          key: cargo-ubuntu-latest-${{ hashFiles('crates/Cargo.lock', 'native/Cargo.lock', 'scripts/tool-versions.env') }}
          restore-keys: cargo-ubuntu-latest-
      - name: Analysis tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          . scripts/tool-versions.env
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "go.uber.org/nilaway/cmd/nilaway@$NILAWAY_VERSION"
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ] || ! cargo audit --version | grep -qF "$CARGO_AUDIT_VERSION"; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION" --force
          fi
      - name: Save analysis tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/bin
            ~/.cargo/bin/cargo-audit
          key: tools-ubuntu-latest-${{ steps.go.outputs.version }}-${{ hashFiles('scripts/tool-versions.env') }}
      # Installed here for the reason the gate job gives: verify.sh --race and
      # --fuzz run the whole default gate first, and the log guard rejects a run
      # whose ruff gate reported "not installed".
      - name: Python lint tool
        env:
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx-bin
        run: |
          . scripts/tool-versions.env
          pipx install "ruff==$RUFF_VERSION"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
          "$PIPX_BIN_DIR/ruff" --version | grep -F "$RUFF_VERSION"
      - name: Sandbox and PATH
        run: |
          # bench/stress_test.py refuses an uncontained Linux shell.
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          # Ubuntu's AppArmor refuses unprivileged user namespaces, so
          # bwrap cannot write its uid map and every sandboxed bench check
          # fails with "setting up uid map: Permission denied". The stress
          # suite refuses to run the shell uncontained, so the kernel has
          # to allow the namespace the suite already requires.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # --race and --fuzz each re-run the default gate first, so this is the
      # whole file plus the extra mode. --race turns cgo on. verify.sh takes
      # DevCouncil's gusset-engine/cgo-env.sh exports before that link;
      # without the umbrella archive the detector dies on -lgusset.
      # 90 minutes is above the serialised race run's measured 4.4 minutes by
      # a wide margin and exists to bound a wedge, not to accommodate one.
      # Tee rather than pipe, for the reason the gate job gives. The log is what
      # the guards below read: before this job kept one, a fuzz or race run in
      # which a tool failed to provision, or a leg degraded to NOT COVERED, was
      # green, because verify.sh exits 0 on those.
      - name: verify.sh --${{ matrix.mode }}
        id: verify
        timeout-minutes: 90
        env:
          MANVI_STEP_TIMES: ${{ runner.temp }}/step-times.tsv
        run: ./verify.sh --${{ matrix.mode }} 2>&1 | tee verify.log; exit "${PIPESTATUS[0]}"

      # Only after a verify.sh that finished, for the reason the gate job gives.
      - name: Save Go caches
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go.outputs.build }}
            ${{ steps.go.outputs.mod }}
          key: go-ubuntu-latest-${{ hashFiles('manvi/go.mod', 'manvi/go.sum') }}
      - name: Save Rust build
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/target
            native/target
          key: cargo-ubuntu-latest-${{ hashFiles('crates/Cargo.lock', 'native/Cargo.lock', 'scripts/tool-versions.env') }}

      - name: Every gate ran and every gap is named
        if: always()
        run: scripts/check-verify-log.sh verify.log ubuntu-latest ${{ matrix.mode }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-log-${{ matrix.mode }}
          path: verify.log
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-timing-${{ matrix.mode }}
          path: ${{ runner.temp }}/step-times.tsv
          if-no-files-found: ignore
          retention-days: 14
