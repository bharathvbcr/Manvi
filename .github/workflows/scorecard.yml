# OpenSSF Scorecard: grades this repository's supply-chain posture (pinned
# actions, token permissions, branch protection, dependency updates, security
# policy) and publishes the result for the README badge. Shaped after
# ossf/scorecard-action's own example workflow.
#
# The Scorecard job is restricted by the action when it publishes: no `run`
# steps and no job-level environment other than what it allows, which is why
# this job is nothing but `uses:` steps. Workflow-level permissions are empty
# and each job asks for what it needs.
name: scorecard

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check updated.
  schedule:
    - cron: '23 5 * * 1'
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the results published to api.scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # The results file is written before publishing, so both uploads run
      # whatever the verdict above was.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: ${{ always() }}
        with:
          sarif_file: results.sarif
