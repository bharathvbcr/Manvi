# Paths holding deliberately fake credentials used as test fixtures.
#
# MANVI ships its own secret scanner (crates/dc-verify), so its test suites must
# contain credential-shaped strings in order to assert that the scanner detects
# them. GitHub secret scanning flags that corpus as real leaks -- most recently
# an "Amazon AWS Temporary Access Key ID" alert on the AWS documentation
# placeholder ASIAIOSFODNN7EXAMPLE in crates/dc-verify/tests/rigor.rs.
#
# Scope is deliberately limited to test code. Production paths stay scanned so a
# genuine leak still raises an alert.
#
# Docs: https://docs.github.com/en/code-security/secret-scanning/using-advanced-secret-scanning-and-push-protection-features/excluding-folders-and-files-from-secret-scanning
paths-ignore:
  # Rust verifier test suite: the secret-scanner fixture corpus (AWS, GitHub,
  # Slack, GitLab, npm, HuggingFace, Google token shapes).
  - "crates/dc-verify/tests/**"

  # Go test files: scrubber and redaction suites assert that placeholder
  # sk-ant-api03-* keys are stripped from logs, sessions, and tool output.
  - "**/*_test.go"
