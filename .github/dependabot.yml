# Four ecosystems. The Rust one is native/, not crates/: crates/ members are
# symlinks into the DevCouncil pin, and the updater aborts with
# "Cargo.toml not found" on them (run 39973487284). Those versions are
# DevCouncil's; manvi/devcouncil/crate_pins_test.go fails the build if this
# workspace drifts from the pin. verify.sh's cargo audit still covers both
# lockfiles. native/ is a real workspace, so that is the cargo directory below.
#
# verify.sh already runs govulncheck over the Go plane and cargo audit over the
# Rust one, so a *vulnerable* dependency is caught on every run. Neither answers
# the question this file is for: a dependency that is merely old. And neither
# looks at the actions at all — the workflow pins them by commit SHA, which is
# the right trade for supply-chain safety and the wrong one for staying current,
# because a pinned SHA never moves on its own. Dependabot is the other half of
# that pin: it opens the pull request that moves it, and verify.sh decides
# whether the move is safe.
version: 2

updates:
  # The workflow's SHA pins. Dependabot rewrites the hash and the version
  # comment beside it together, which is why the comment is written in the form
  # it expects.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ""          # this repository's subjects carry no prefix
    labels: []

  # The Go plane. Three direct dependencies, held to an allowlist by verify.sh —
  # a fourth is a build failure, so an update here can only ever move one of the
  # three or a transitive of one.
  - package-ecosystem: gomod
    directory: /manvi
    schedule:
      interval: weekly
    commit-message:
      prefix: ""
    labels: []

  # The desktop broker. Its members are directories in this repository, unlike
  # crates/, whose members are symlinks Dependabot cannot fetch.
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
    commit-message:
      prefix: ""
    labels: []

  # Dev-time documentation gate only (jsdom + mermaid). Nothing here ships
  # in the manvi binary; verify.sh still runs the parser against every fence.
  # Version updates only: GitHub opens no alerts or security PRs for bun.lock,
  # so verify.sh's `bun audit` step is what catches a vulnerable package.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ""
    labels: []
