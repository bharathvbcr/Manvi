[package]
name = "manvi-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
desktop-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
desktop-macos = { path = "../desktop-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
desktop-windows = { path = "../desktop-windows" }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
desktop-linux = { path = "../desktop-linux" }

[lints]
workspace = true
