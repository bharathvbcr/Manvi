[workspace]
members = ["crates/desktop-core", "crates/desktop-macos", "crates/desktop-windows", "crates/desktop-linux", "crates/manvi-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
desktop-core = { path = "crates/desktop-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

